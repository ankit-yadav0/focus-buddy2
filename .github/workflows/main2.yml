name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Project's gradlew wrapper script (gradlew / gradlew.bat / gradle-wrapper.jar)
      # isn't committed to the repo - only gradle-wrapper.properties is present.
      # This action installs Gradle directly so the build doesn't depend on ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # The Secrets Gradle Plugin (used for API keys like Gemini) requires its
      # default properties file to exist even when no real secrets are needed for
      # a debug build. This file is normally gitignored (correctly - it shouldn't
      # contain real keys in the repo), so CI creates an empty placeholder here.
      - name: Ensure .env.example exists for Secrets Gradle Plugin
        run: touch .env.example

      # The project's debugConfig signing config points at a debug.keystore file
      # in the repo root, which isn't committed (keystores are usually gitignored).
      # This generates a standard Android debug keystore with the conventional
      # credentials (store/key password "android", alias "androiddebugkey") that
      # Android Studio itself uses by default. If the project's actual signing
      # config uses different values, this step needs updating to match.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focussbuddy-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Decode the release keystore from a repo secret (never committed to the repo).
      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      # -Pandroid.injected.signing.* are Gradle properties the Android Gradle Plugin
      # recognizes automatically for whichever signingConfig references them. If the
      # project's build.gradle.kts doesn't yet have a "release" signingConfig block at
      # all, this build may still produce an unsigned APK - in that case the
      # signingConfigs block needs to be added to app/build.gradle.kts.
      - name: Build release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: focussbuddy-release-apk
          path: app/build/outputs/apk/release/*.apk
