name: Build APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release + tag

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure .env.example exists for Secrets Gradle Plugin
        run: touch .env.example

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # versionCode must go UP on every build the in-app updater should ever
      # notice - github.run_number does that automatically (1, 2, 3, ... on
      # every workflow run). versionName is just a human-readable label.
      - name: Compute version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focussbuddy-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # --- Release signing (only if secrets are configured) ---

      # Check whether the release keystore secret exists before attempting
      # to decode it. If it is missing the release steps are skipped
      # gracefully so the debug APK is still uploaded and the workflow
      # run does not fail.
      - name: Check release secrets
        id: secrets
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "have_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 secret not configured — skipping release APK build."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # Secrets go in through env vars, never interpolated into the script text: a password
      # containing $, ", ` or a newline would otherwise break (or inject into) the shell command.
      - name: Decode release keystore
        if: steps.secrets.outputs.have_release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build release APK
        if: steps.secrets.outputs.have_release == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          EFFECTIVE_KEY_ALIAS="${KEY_ALIAS:-upload}"
          EFFECTIVE_KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          gradle assembleRelease --no-daemon --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$EFFECTIVE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$EFFECTIVE_KEY_PASSWORD"

      - name: Upload release APK
        if: steps.secrets.outputs.have_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: focussbuddy-release-apk
          path: app/build/outputs/apk/release/*.apk

      # This is the step that was missing entirely: UpdateManager.kt polls
      # GitHub's /releases/latest API and expects a tag named "v<versionCode>"
      # with the APK attached as a downloadable asset. Uploading to Actions
      # artifacts (above) does NOT satisfy that - artifacts need a login to
      # download and never show up in the Releases API at all. Only runs on
      # an actual push to main, not on pull_request builds, so PRs don't spam
      # releases and don't need a real signing secret to build/test.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && steps.secrets.outputs.have_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.code }}
          name: v${{ steps.version.outputs.code }}
          files: app/build/outputs/apk/release/*.apk
