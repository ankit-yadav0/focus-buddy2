name: Build APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release + tag

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure .env.example exists for Secrets Gradle Plugin
        run: touch .env.example

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # versionCode must go UP on every build the in-app updater should ever
      # notice - github.run_number does that automatically (1, 2, 3, ... on
      # every workflow run). versionName is just a human-readable label.
      - name: Compute version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focussbuddy-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: focussbuddy-release-apk
          path: app/build/outputs/apk/release/*.apk

      # This is the step that was missing entirely: UpdateManager.kt polls
      # GitHub's /releases/latest API and expects a tag named "v<versionCode>"
      # with the APK attached as a downloadable asset. Uploading to Actions
      # artifacts (above) does NOT satisfy that - artifacts need a login to
      # download and never show up in the Releases API at all. Only runs on
      # an actual push to main, not on pull_request builds, so PRs don't spam
      # releases and don't need a real signing secret to build/test.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.code }}
          name: v${{ steps.version.outputs.code }}
          files: app/build/outputs/apk/release/*.apk
