name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Project's gradlew wrapper script (gradlew / gradlew.bat / gradle-wrapper.jar)
      # isn't committed to the repo - only gradle-wrapper.properties is present.
      # This action installs Gradle directly so the build doesn't depend on ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # The Secrets Gradle Plugin (used for API keys like Gemini) requires its
      # default properties file to exist even when no real secrets are needed for
      # a debug build. This file is normally gitignored (correctly - it shouldn't
      # contain real keys in the repo), so CI creates an empty placeholder here.
      - name: Ensure .env.example exists for Secrets Gradle Plugin
        run: touch .env.example

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focussbuddy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
